# `mise run check` (hadolint, actionlint) when an image or the workflows change.
name: check

on:
  push:
    paths: ["*/Containerfile", .github/**, .config/**]
  pull_request:
    paths: ["*/Containerfile", .github/**, .config/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run check
