# The website's image, named after its domain: on changes to it on main, and by hand; then the host
# updates it (push trigger).
name: ai-bedrock.dev

on:
  push:
    branches: [main]
    paths: [ai-bedrock.dev/**, .github/workflows/ai-bedrock.dev.yml, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-bedrock.dev
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      image: ai-bedrock.dev
      deploy: true
    secrets:
      IMAGE_SIGNING_KEY: ${{ secrets.IMAGE_SIGNING_KEY }}
      IMAGE_SIGNING_PASSPHRASE: ${{ secrets.IMAGE_SIGNING_PASSPHRASE }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
