# Tooling and tasks: `mise install`, then `mise run` lists them. Caches live in .config/.local/.

[tools]
hadolint = "2.15.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.containerfiles]
description = "hadolint on every image's Containerfile"
dir = "{{config_root}}"
run = "hadolint */Containerfile && echo 'Containerfiles: ok'"

[tasks.actions]
description = "actionlint on the workflows"
dir = "{{config_root}}"
run = "actionlint && echo 'workflows: ok'"

[tasks.shell]
description = "shellcheck on the images' scripts"
dir = "{{config_root}}"
run = "shellcheck coreos/rootfs/usr/libexec/ai-bedrock/* */test.sh && echo 'scripts: ok'"

[tasks.test-nginx]
description = "build nginx and test it against a local ACME server (podman), as CI does before a push"
dir = "{{config_root}}"
run = "podman build -q -t localhost/nginx:test nginx >/dev/null && nginx/test.sh localhost/nginx:test"

[tasks.check]
description = "everything that must be green before a commit"
depends = ["containerfiles", "actions", "shell"]
