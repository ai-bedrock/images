# Key-only SSH for the admin user; sorts before the distribution's files, and sshd keeps the
# first value it reads.
PermitRootLogin no
AllowUsers core deploy
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30

# The deploy user runs one command, whatever the client asks: the image names it sends go to that
# command as SSH_ORIGINAL_COMMAND. Its keys are root's to write, in /etc/image-update (Ignition);
# no shell, pty, forwarding, tunnel or rc file.
Match User deploy
	AuthorizedKeysFile /etc/image-update/authorized_keys
	ForceCommand /usr/libexec/ai-bedrock/deploy
	PermitTTY no
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	PermitListen none
	PermitOpen none
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
Match all
