# Key-only SSH for the admin user; sorts before the distribution's files, and sshd keeps the
# first value it reads.
PermitRootLogin no
AllowUsers core deploy
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30

# Crypto: this file sorts before the system crypto policy's include
# (40-redhat-crypto-policies.conf), so these win. Post-quantum hybrid or X25519 key exchange,
# AEAD ciphers, encrypt-then-MAC only, and only the ed25519 host key.
KexAlgorithms mlkem768x25519-sha256,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
HostKey /etc/ssh/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com

# No agent, remote port or socket forwarding, compression or rc file for anyone; local port
# forwarding (-L) stays for the admin. Dead clients drop after 10 minutes; each login logs its
# key's fingerprint.
AllowAgentForwarding no
AllowTcpForwarding local
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
PermitUserRC no
Compression no
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE

# The deploy user runs one command, whatever the client asks: the image names it sends go to that
# command as SSH_ORIGINAL_COMMAND. Its keys are root's to write, in /etc/image-update (Ignition);
# no shell, pty, forwarding, tunnel or rc file; a connection that opens no session closes after 30 s.
Match User deploy
	AuthorizedKeysFile /etc/image-update/authorized_keys
	ForceCommand /usr/libexec/ai-bedrock/deploy
	PermitTTY no
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	PermitListen none
	PermitOpen none
	PermitTunnel no
	PermitUserRC no
	X11Forwarding no
	UnusedConnectionTimeout 30s
Match all
