# Kernel and network hardening on top of Fedora's defaults. The globs also reach interfaces that
# appear later (systemd-sysctl reapplies them per interface).
# No ICMP redirects taken or sent: routes come from DHCP only.
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.*.send_redirects = 0
# Kernel pointers hidden from unprivileged users; ptrace only of one's own children.
kernel.kptr_restrict = 1
kernel.yama.ptrace_scope = 1
# No core dumps of setuid programs; JIT-compiled BPF hardened; no kexec of another kernel.
fs.suid_dumpable = 0
net.core.bpf_jit_harden = 2
kernel.kexec_load_disabled = 1
