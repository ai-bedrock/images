# Host firewall: inbound SSH, HTTP and HTTPS only, in its own table, so container networking's
# tables (netavark) stay untouched.
destroy table inet host
table inet host {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport 68 accept comment "DHCPv4 client"
		ip6 saddr fe80::/10 udp dport 546 accept comment "DHCPv6 client"
		tcp dport 22 accept comment "SSH"
		tcp dport { 80, 443 } accept comment "HTTP and HTTPS"
	}
}
