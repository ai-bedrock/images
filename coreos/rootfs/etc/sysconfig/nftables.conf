# Host firewall: inbound SSH, HTTP and HTTPS only, in its own table, so container networking's
# tables (netavark) stay untouched. New SSH connections are rate-limited per source address (a
# client over the limit is dropped until it slows down; sshd's own penalties handle failed
# logins). The cloud's metadata service (which serves the server's user-data) is refused to the
# host and to containers: only the first boot, before this image runs, needs it.
destroy table inet host
table inet host {
	set ssh_new4 {
		type ipv4_addr
		flags dynamic, timeout
		timeout 5m
	}

	set ssh_new6 {
		type ipv6_addr
		flags dynamic, timeout
		timeout 5m
	}

	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport 68 accept comment "DHCPv4 client"
		ip6 saddr fe80::/10 udp dport 546 accept comment "DHCPv6 client"
		tcp dport 22 ct state new update @ssh_new4 { ip saddr limit rate over 15/minute burst 30 packets } drop comment "SSH, too many new connections"
		tcp dport 22 ct state new update @ssh_new6 { ip6 saddr limit rate over 15/minute burst 30 packets } drop comment "SSH, too many new connections (IPv6)"
		tcp dport 22 accept comment "SSH"
		tcp dport { 80, 443 } accept comment "HTTP and HTTPS"
	}

	# From the host itself, rootless containers (pasta) included.
	chain output {
		type filter hook output priority filter; policy accept;
		ip daddr 169.254.169.254 reject comment "metadata service"
		ip6 daddr fe80::a9fe:a9fe reject comment "metadata service (IPv6)"
	}

	# From rootful containers, routed through the host.
	chain forward {
		type filter hook forward priority filter; policy accept;
		ip daddr 169.254.169.254 reject comment "metadata service"
		ip6 daddr fe80::a9fe:a9fe reject comment "metadata service (IPv6)"
	}
}
